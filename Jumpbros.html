<!DOCTYPE html>
<html>
<head>
    <title>Super Mario</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #121212;
            touch-action: manipulation;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #4d88ff;
            background: #1e1e1e;
            max-width: 100%;
            max-height: 100%;
            display: none;
        }
        #menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 90%;
            max-width: 500px;
        }
        .menu-title {
            color: #4d88ff;
            font-size: 36px;
            margin-bottom: 20px;
            text-align: center;
        }
        .menu-section {
            width: 100%;
            background: rgba(30, 30, 30, 0.8);
            border: 2px solid #4d88ff;
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
        }
        .section-title {
            color: white;
            font-size: 20px;
            margin-bottom: 10px;
        }
        .menu-btn {
            padding: 12px 20px;
            background: rgba(77, 136, 255, 0.3);
            border: 2px solid #4d88ff;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
            transition: all 0.2s;
        }
        .menu-btn:hover, .menu-btn:active {
            background: rgba(77, 136, 255, 0.6);
        }
        .menu-btn.selected {
            background: #4d88ff;
            font-weight: bold;
        }
        .level-btn {
            display: inline-block;
            width: 60px;
            height: 60px;
            line-height: 60px;
            text-align: center;
            margin: 5px;
        }
        #settings {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        .slider {
            width: 60%;
        }
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            display: none;
        }
        #level-name {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 20px;
            display: none;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            display: none;
        }
        .control-btn {
            width: 80px;
            height: 60px;
            background: rgba(77, 136, 255, 0.3);
            border: 2px solid #4d88ff;
            border-radius: 10px;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .control-btn:active {
            background: rgba(77, 136, 255, 0.6);
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 36px;
            z-index: 10;
        }
        #back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 10px;
            background: rgba(77, 136, 255, 0.3);
            border: 2px solid #4d88ff;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: none;
            z-index: 5;
        }
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #4d88ff;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
    </style>

        // Set canvas size
        function resizeCanvas() {
            const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
            canvas.width = size;
            canvas.height = size * 0.6;
        }
        
        // Initialize game
        function initGame() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            
            const level = levels[currentLevel];
            
            mario = {
                x: 100,
                y: 100,
                width: MARIO_WIDTH,
                height: MARIO_HEIGHT,
                velocityX: 0,
                velocityY: 0,
                isJumping: false,
                facingRight: true
            };
            
            platforms = [...level.platforms];
            enemies = [...level.enemies];
            coins = [...level.coins];
            
            // Add ground platform
            platforms.push({
                x: 0, 
                y: canvas.height - PLATFORM_HEIGHT, 
                width: level.length, 
                height: PLATFORM_HEIGHT
            });
            
            score = 0;
            cameraX = 0;
            scoreElement.textContent = `Score: ${score}`;
            levelNameElement.textContent = level.name;
            gameOverElement.style.display = 'none';
            gameRunning = true;
            canJump = true;
            
            // Adjust difficulty
            adjustDifficulty();
            
            // Start game loop
            gameLoop();
        }
        
        // Adjust game difficulty
        function adjustDifficulty() {
            switch(difficulty) {
                case 'easy':
                    enemies.forEach(e => e.speed = 1.5);
                    break;
                case 'normal':
                    enemies.forEach(e => e.speed = 2);
                    break;
                case 'hard':
                    enemies.forEach(e => e.speed = 2.5);
                    break;
            }
        }
        
        // Game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            update();
            draw();
            
            animationFrameId = requestAnimationFrame(gameLoop);
        }
        
        // Update game state
        function update() {
            const level = levels[currentLevel];
            
            // Mario movement
            mario.velocityX = 0;
            
            if (keys.left) {
                mario.velocityX = -MOVE_SPEED;
                mario.facingRight = false;
            }
            if (keys.right) {
                mario.velocityX = MOVE_SPEED;
                mario.facingRight = true;
            }
            
            // Apply gravity
            mario.velocityY += GRAVITY;
            
            // Handle jumping
            if (keys.jump && !mario.isJumping) {
                mario.velocityY = JUMP_FORCE;
                mario.isJumping = true;
                canJump = false;
            }
            
            // Update position
            mario.x += mario.velocityX;
            mario.y += mario.velocityY;
            
            // Reset jump state before collision detection
            mario.isJumping = true;
            
            // Platform collision
            let onGround = false;
            for (const platform of platforms) {
                if (checkCollision(mario, platform)) {
                    // Top collision (landing on platform)
                    if (mario.velocityY > 0 && mario.y + mario.height/2 < platform.y + 10) {
                        mario.y = platform.y - mario.height;
                        mario.velocityY = 0;
                        mario.isJumping = false;
                        onGround = true;
                        canJump = true;
                    }
                    // Bottom collision (hitting head)
                    else if (mario.velocityY < 0) {
                        mario.y = platform.y + platform.height;
                        mario.velocityY = 0;
                    }
                    // Side collision
                    else if (mario.velocityX !== 0) {
                        if (mario.velocityX > 0) {
                            mario.x = platform.x - mario.width;
                        } else {
                            mario.x = platform.x + platform.width;
                        }
                    }
                }
            }
            
            // Enemy movement and collision
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                
                // Simple back-and-forth movement
                enemy.x += enemy.direction * enemy.speed;
                
                // Check if enemy should turn around
                let shouldTurn = false;
                for (const platform of platforms) {
                    if (enemy.x <= platform.x || enemy.x + enemy.width >= platform.x + platform.width) {
                        shouldTurn = true;
                        break;
                    }
                }
                
                if (shouldTurn) {
                    enemy.direction *= -1;
                }
                
                // Check collision with Mario
                if (checkCollision(mario, enemy)) {
                    // Mario jumps on enemy
                    if (mario.velocityY > 0 && mario.y + mario.height/2 < enemy.y + 10) {
                        enemies.splice(i, 1);
                        mario.velocityY = JUMP_FORCE * 0.7;
                        score += 100;
                        scoreElement.textContent = `Score: ${score}`;
                    } else {
                        gameOver();
                        return;
                    }
                }
            }
            
            // Coin collection
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                if (!coin.collected && checkCollision(mario, coin)) {
                    coin.collected = true;
                    score += 50;
                    scoreElement.textContent = `Score: ${score}`;
                }
            }
            
            // Camera follow
            cameraX = mario.x - canvas.width / 3;
            cameraX = Math.max(0, Math.min(cameraX, level.length - canvas.width));
            
            // Check if Mario reached the end
            if (mario.x > level.length - 100) {
                levelComplete();
                return;
            }
            
            // Check if Mario fell off the world
            if (mario.y > canvas.height + 100) {
                gameOver();
            }
        }
        
        // Level complete
        function levelComplete() {
            gameRunning = false;
            gameOverElement.style.display = 'flex';
            finalScoreElement.textContent = `Level Complete! Score: ${score}`;
            restartBtn.textContent = "Next Level";
            
            // Unlock next level if available
            if (currentLevel < 5) {
                const nextLevelBtn = document.querySelector(`.level-btn[data-level="${currentLevel + 1}"]`);
                if (nextLevelBtn) {
                    nextLevelBtn.classList.remove('disabled');
                }
            }
        }
        
        // Draw game
        function draw() {
            const level = levels[currentLevel];
            
            // Clear canvas
            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw sky gradient based on level
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            
            switch(currentLevel) {
                case 1: // Mushroom Plains
                    skyGradient.addColorStop(0, '#4d88ff');
                    skyGradient.addColorStop(1, '#1e1e1e');
                    break;
                case 2: // Desert Hills
                    skyGradient.addColorStop(0, '#ff8844');
                    skyGradient.addColorStop(1, '#1e1e1e');
                    break;
                case 3: // Snowy Peaks
                    skyGradient.addColorStop(0, '#88ccff');
                    skyGradient.addColorStop(1, '#1e1e1e');
                    break;
                case 4: // Lava Caverns
                    skyGradient.addColorStop(0, '#ff4444');
                    skyGradient.addColorStop(1, '#1e1e1e');
                    break;
                case 5: // Cloud Kingdom
                    skyGradient.addColorStop(0, '#ffffff');
                    skyGradient.addColorStop(1, '#88ccff');
                    break;
            }
            
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw platforms (only those in view)
            ctx.fillStyle = currentLevel === 3 ? '#ffffff' : '#44aa44'; // White for snow level
            platforms.forEach(platform => {
                if (platform.x + platform.width > cameraX && platform.x < cameraX + canvas.width) {
                    ctx.fillRect(
                        platform.x - cameraX, 
                        platform.y, 
                        platform.width, 
                        platform.height
                    );
                }
            });
            
            // Draw coins
            coins.forEach(coin => {
                if (!coin.collected && coin.x + coin.width > cameraX && coin.x < cameraX + canvas.width) {
                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(
                        coin.x - cameraX + coin.width/2, 
                        coin.y + coin.height/2, 
                        coin.width/2, 
                        0, 
                        Math.PI * 2
                    );
                    ctx.fill();
                }
            });
            
            // Draw enemies
            ctx.fillStyle = '#ff4444';
            enemies.forEach(enemy => {
                if (enemy.x + enemy.width > cameraX && enemy.x < cameraX + canvas.width) {
                    ctx.fillRect(
                        enemy.x - cameraX, 
                        enemy.y, 
                        enemy.width, 
                        enemy.height
                    );
                }
            });
            
            // Draw Mario
            ctx.fillStyle = mario.facingRight ? '#ff4444' : '#ff0000';
            ctx.fillRect(
                mario.x - cameraX - mario.width/2, 
                mario.y - mario.height/2, 
                mario.width, 
                mario.height
            );
            
            // Draw Mario's hat
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(
                mario.x - cameraX - mario.width/2, 
                mario.y - mario.height/2 - 10, 
                mario.width, 
                10
            );
            
            // Draw Mario's mustache
            ctx.fillStyle = '#000000';
            ctx.fillRect(
                mario.x - cameraX - mario.width/2 + 5, 
                mario.y - mario.height/2 + 20, 
                mario.width - 10, 
                5
            );
        }
        
        // Make Mario jump
        function jump() {
            if (!gameRunning) {
                startGame();
            } else {
                keys.jump = true;
            }
        }
        
        function stopJump() {
            keys.jump = false;
        }
        
        // Check for collisions between two objects
        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                   obj1.x + obj1.width > obj2.x &&
                   obj1.y < obj2.y + obj2.height &&
                   obj1.y + obj1.height > obj2.y;
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            gameOverElement.style.display = 'flex';
            finalScoreElement.textContent = `Final Score: ${score}`;
            restartBtn.textContent = "Try Again";
        }
        
        // Start the game
        function startGame() {
            menu.style.display = 'none';
            canvas.style.display = 'block';
            scoreElement.style.display = 'block';
            levelNameElement.style.display = 'block';
            backBtn.style.display = 'block';
            document.getElementById('controls').style.display = 'flex';
            gameOverElement.style.display = 'none';
            
            // Get settings
            difficulty = document.getElementById('difficulty').value;
            
            initGame();
        }
        
        // Back to menu
        function backToMenu() {
            gameRunning = false;
            menu.style.display = 'flex';
            canvas.style.display = 'none';
            scoreElement.style.display = 'none';
            levelNameElement.style.display = 'none';
            backBtn.style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            gameOverElement.style.display = 'none';
        }
        
        // Event listeners for buttons
        document.getElementById('left-btn').addEventListener('touchstart', () => keys.left = true);
        document.getElementById('left-btn').addEventListener('touchend', () => keys.left = false);
        document.getElementById('right-btn').addEventListener('touchstart', () => keys.right = true);
        document.getElementById('right-btn').addEventListener('touchend', () => keys.right = false);
        document.getElementById('jump-btn').addEventListener('touchstart', jump);
        document.getElementById('jump-btn').addEventListener('touchend', stopJump);
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'ArrowRight') keys.right = true;
            if (e.key === ' ' || e.key === 'ArrowUp') jump();
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
            if (e.key === ' ' || e.key === 'ArrowUp') stopJump();
        });
        
        // Level selection
        levelButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                levelButtons.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                currentLevel = parseInt(btn.dataset.level);
            });
        });
        
        playBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        backBtn.addEventListener('click', backToMenu);
        window.addEventListener('resize', resizeCanvas);
        
        // Initialize
        resizeCanvas();
    </script>
</body>
</html>
