<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paperboy Clone</title>
  <style>
    body { margin: 0; overflow: hidden; background: #87ceeb; }
    canvas { display: block; }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 24px;
      color: white;
      font-family: sans-serif;
    }
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    .btn {
      background: rgba(255, 255, 255, 0.7);
      border: none;
      padding: 10px 20px;
      font-size: 20px;
      border-radius: 10px;
    }
    #menuOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 36px;
      font-family: sans-serif;
      z-index: 100;
    }
  </style>
</head>
<body>
<div id="score">Score: 0</div>
<div id="menuOverlay" style="display: none;">Game Over<br><button onclick="restartGame()" class="btn" style="margin-top: 20px;">Restart</button></div>
<div class="controls">
  <button class="btn" id="left">⬅️</button>
  <button class="btn" id="right">➡️</button>
  <button class="btn" id="throw">📤</button>
</div>
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<script>
let scene, camera, renderer, player, houses = [], roofs = [], papers = [], cars = [], clouds = [], score = 0, windows = [], doors = [];
const paperSpeed = 0.5;
const houseHitDistance = 2;
const keys = {};
let roadDirection = 0;
let turnDirection = 0;
let isNight = false;
let deliveredHouses = new Set();
let gameOver = false;

init();
animate();

function restartGame() {
  location.reload();
}

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 5, 10);

  renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(0, 10, 10).normalize();
  scene.add(light);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(20, 1000),
    new THREE.MeshLambertMaterial({ color: 0x228B22 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(6, 1000),
    new THREE.MeshLambertMaterial({ color: 0x333333 })
  );
  road.position.y = 0.01;
  road.rotation.x = -Math.PI / 2;
  scene.add(road);

  player = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshLambertMaterial({ color: 0xff0000 })
  );
  player.position.set(0, 0.5, 0);
  scene.add(player);

  for (let i = 0; i < 30; i++) {
    const houseColor = Math.random() * 0xffffff;
    const house = new THREE.Mesh(
      new THREE.BoxGeometry(2.5, 2.5, 2.5),
      new THREE.MeshLambertMaterial({ color: houseColor })
    );
    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(2.2, 1, 4),
      new THREE.MeshLambertMaterial({ color: 0x8B0000 })
    );
    const door = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 1, 0.1),
      new THREE.MeshLambertMaterial({ color: 0x654321 })
    );
    const window1 = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.5, 0.1),
      new THREE.MeshLambertMaterial({ color: 0x87cefa })
    );
    const window2 = window1.clone();

    const side = Math.random() > 0.5 ? 6 : -6;
    const zPos = -i * 20 - 20;

    house.position.set(side, 1.25, zPos);
    roof.position.set(side, 3, zPos);
    roof.rotation.y = Math.PI / 4;
    door.position.set(side, 0.5, zPos + 1.3);
    window1.position.set(side - 0.6, 1.5, zPos + 1.3);
    window2.position.set(side + 0.6, 1.5, zPos + 1.3);

    scene.add(house, roof, door, window1, window2);
    houses.push(house);
    roofs.push(roof);
    doors.push(door);
    windows.push(window1, window2);
  }

  for (let i = 0; i < 10; i++) {
    const car = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 1, 2.5),
      new THREE.MeshLambertMaterial({ color: 0x0000ff })
    );
    car.position.set((Math.random() > 0.5 ? -1 : 1) * 2, 0.5, -Math.random() * 500);
    car.direction = Math.random() > 0.5 ? 1 : -1;
    scene.add(car);
    cars.push(car);
  }

  for (let i = 0; i < 10; i++) {
    const cloud = new THREE.Mesh(
      new THREE.BoxGeometry(4, 2, 2),
      new THREE.MeshLambertMaterial({ color: 0xffffff })
    );
    cloud.position.set(Math.random() * 40 - 20, 10 + Math.random() * 3, -Math.random() * 200);
    scene.add(cloud);
    clouds.push(cloud);
  }

  window.addEventListener('keydown', e => keys[e.code] = true);
  window.addEventListener('keyup', e => keys[e.code] = false);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') throwPaper();
  });

  document.getElementById('left').addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowLeft'] = true; });
  document.getElementById('left').addEventListener('touchend', e => { e.preventDefault(); keys['ArrowLeft'] = false; });
  document.getElementById('right').addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowRight'] = true; });
  document.getElementById('right').addEventListener('touchend', e => { e.preventDefault(); keys['ArrowRight'] = false; });
  document.getElementById('throw').addEventListener('touchstart', e => { e.preventDefault(); throwPaper(); });
}

function throwPaper() {
  const paper = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.2, 0.1), // Short and stubby rectangle
    new THREE.MeshLambertMaterial({ color: 0xffffff })
  );

  // Create a red stripe in the middle
  const stripe = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.05, 0.1),
    new THREE.MeshLambertMaterial({ color: 0xff0000 })
  );
  stripe.position.set(0, 0, 0);

  paper.add(stripe); // Add the stripe to the paper

  paper.position.copy(player.position);
  paper.velocity = new THREE.Vector3(player.position.x < 0 ? -paperSpeed : paperSpeed, 0, 0);
  papers.push(paper);
  scene.add(paper);
}

function animate() {
  if (gameOver) return;

  requestAnimationFrame(animate);

  if (Math.random() < 0.003) {
    turnDirection = Math.random() > 0.5 ? 0.03 : -0.03;
  }
  roadDirection += turnDirection;

  if (keys['ArrowLeft']) player.position.x -= 0.2;
  if (keys['ArrowRight']) player.position.x += 0.2;

  player.position.x = Math.max(-8, Math.min(8, player.position.x));

  for (let i = 0; i < houses.length; i++) {
    houses[i].position.z += 0.1;
    roofs[i].position.z += 0.1;
    doors[i].position.z += 0.1;
    windows[i*2].position.z += 0.1;
    windows[i*2+1].position.z += 0.1;

    if (houses[i].position.z > 10) {
      houses[i].position.z -= 600;
      roofs[i].position.z -= 600;
      doors[i].position.z -= 600;
      windows[i*2].position.z -= 600;
      windows[i*2+1].position.z -= 600;
    }
  }

  for (let cloud of clouds) {
    cloud.position.z += 0.05;
    if (cloud.position.z > 10) cloud.position.z -= 200;
  }

  for (let car of cars) {
    car.position.z += 0.2 * car.direction + 0.1;
    if (car.position.z > 10) car.position.z = -500 - Math.random() * 200;
  }

  for (let i = papers.length - 1; i >= 0; i--) {
    papers[i].position.add(papers[i].velocity);
    papers[i].position.z += 0.1;

    for (let j = 0; j < houses.length; j++) {
      const dist = papers[i].position.distanceTo(houses[j].position);
      if (dist < houseHitDistance) {
        if (!deliveredHouses.has(houses[j])) {
          deliveredHouses.add(houses[j]);
          score++;
          document.getElementById('score').textContent = 'Score: ' + score;
        }
        scene.remove(papers[i]);
        papers.splice(i, 1);
        break;
      }
    }
  }

  if (!isNight && score >= 30) {
    scene.background = new THREE.Color(0x001a33);
    isNight = true;
  }

  for (let car of cars) {
    if (Math.abs(car.position.z) < 1.5 && Math.abs(car.position.x - player.position.x) < 1.5) {
      document.getElementById('menuOverlay').style.display = 'flex';
      gameOver = true;
      return;
    }
  }

  camera.position.z = 10;
  camera.position.y = 5;
  camera.position.x = player.position.x;
  camera.lookAt(player.position);

  renderer.render(scene, camera);
}
</script>
</body>
</html>
