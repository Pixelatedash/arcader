<!DOCTYPE html>
<html>
<head>
    <title>Doodle Jump</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #121212;
            touch-action: manipulation;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #4d88ff;
            background: #1e1e1e;
            max-width: 100%;
            max-height: 100%;
        }
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .control-btn {
            width: 80px;
            height: 60px;
            background: rgba(77, 136, 255, 0.3);
            border: 2px solid #4d88ff;
            border-radius: 10px;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .control-btn:active {
            background: rgba(77, 136, 255, 0.6);
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 36px;
        }
        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #4d88ff;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="score">Score: 0 | Height: 0</div>
    <canvas id="gameCanvas"></canvas>
    
    <div id="controls">
        <div class="control-btn" id="left-btn">←</div>
        <div class="control-btn" id="right-btn">→</div>
    </div>
    
    <div id="game-over">
        Game Over!
        <div id="final-score"></div>
        <button id="restart-btn">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        
        // Game settings
        const PLAYER_SIZE = 30;
        const PLATFORM_WIDTH = 70;
        const PLATFORM_HEIGHT = 15;
        const GRAVITY = 0.4;
        const JUMP_FORCE = -12;
        
        // Game variables
        let player = { x: 0, y: 0, vy: 0 };
        let platforms = [];
        let score = 0;
        let maxHeight = 0;
        let gameRunning = false;
        let animationFrameId;
        let keys = { left: false, right: false };
        let cameraOffset = 0;
        
        // Set canvas size
        function resizeCanvas() {
            const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
            canvas.width = size;
            canvas.height = size * 1.2;
            initGame();
        }
        
        // Initialize game
        function initGame() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            
            player = {
                x: canvas.width / 2 - PLAYER_SIZE / 2,
                y: canvas.height - 100,
                vy: 0
            };
            
            platforms = [];
            score = 0;
            maxHeight = 0;
            cameraOffset = 0;
            gameOverElement.style.display = 'none';
            gameRunning = true;
            
            // Create initial platforms
            for (let i = 0; i < 10; i++) {
                platforms.push(createPlatform(canvas.height - i * 100));
            }
            
            gameLoop();
        }
        
        // Create a platform
        function createPlatform(y) {
            return {
                x: Math.random() * (canvas.width - PLATFORM_WIDTH),
                y: y,
                width: PLATFORM_WIDTH,
                height: PLATFORM_HEIGHT
            };
        }
        
        // Game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            update();
            draw();
            
            animationFrameId = requestAnimationFrame(gameLoop);
        }
        
        // Update game state
        function update() {
            // Player movement
            if (keys.left) player.x -= 5;
            if (keys.right) player.x += 5;
            
            // Wrap around screen
            if (player.x < -PLAYER_SIZE) player.x = canvas.width;
            if (player.x > canvas.width) player.x = -PLAYER_SIZE;
            
            // Apply gravity
            player.vy += GRAVITY;
            player.y += player.vy;
            
            // Check platform collisions
            let onPlatform = false;
            platforms.forEach(platform => {
                if (
                    player.vy > 0 &&
                    player.x + PLAYER_SIZE > platform.x &&
                    player.x < platform.x + platform.width &&
                    player.y + PLAYER_SIZE > platform.y &&
                    player.y + PLAYER_SIZE < platform.y + platform.height + 10
                ) {
                    player.y = platform.y - PLAYER_SIZE;
                    player.vy = JUMP_FORCE;
                    onPlatform = true;
                }
            });
            
            // Update camera
            if (player.y < canvas.height / 2) {
                cameraOffset = canvas.height / 2 - player.y;
                maxHeight = Math.max(maxHeight, cameraOffset);
                score = Math.floor(maxHeight / 10);
            }
            
            // Generate new platforms
            while (platforms.length < 10) {
                const lastPlatform = platforms[platforms.length - 1];
                platforms.push(createPlatform(lastPlatform.y - 100 - Math.random() * 50));
            }
            
            // Remove platforms that are off screen
            platforms = platforms.filter(platform => platform.y < canvas.height + cameraOffset + 100);
            
            // Update score
            scoreElement.textContent = `Score: ${score} | Height: ${maxHeight}`;
            
            // Check game over
            if (player.y > canvas.height + cameraOffset) {
                gameOver();
            }
        }
        
        // Draw game
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw platforms
            ctx.fillStyle = '#4d88ff';
            platforms.forEach(platform => {
                ctx.fillRect(
                    platform.x,
                    platform.y + cameraOffset,
                    platform.width,
                    platform.height
                );
            });
            
            // Draw player
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(
                player.x,
                player.y + cameraOffset,
                PLAYER_SIZE / 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // Draw eyes
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(
                player.x - 5,
                player.y + cameraOffset - 5,
                3,
                0,
                Math.PI * 2
            );
            ctx.arc(
                player.x + 5,
                player.y + cameraOffset - 5,
                3,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            gameOverElement.style.display = 'flex';
            finalScoreElement.textContent = `Final Score: ${score}`;
        }
        
        // Event listeners
        document.getElementById('left-btn').addEventListener('touchstart', () => keys.left = true);
        document.getElementById('left-btn').addEventListener('touchend', () => keys.left = false);
        document.getElementById('right-btn').addEventListener('touchstart', () => keys.right = true);
        document.getElementById('right-btn').addEventListener('touchend', () => keys.right = false);
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'ArrowRight') keys.right = true;
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
        });
        
        restartBtn.addEventListener('click', initGame);
        window.addEventListener('resize', resizeCanvas);
        
        // Start the game
        resizeCanvas();
    </script>
</body>
</html>
